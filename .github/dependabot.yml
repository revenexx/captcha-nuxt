# Dependabot (PE-1128), from revenexx/.github templates/dependabot.yml.
# The reasons behind every setting are in the template; only the
# ecosystems and folders of this repository are kept here.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # typescript-eslint does not support TypeScript 7 yet ("typescript-eslint
      # does not support TS 7.0" turned the npm group red, 2026-11-17). Out
      # again once a typescript-eslint release supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types follow the Node release the image runs (22), not ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    ignore:
      - dependency-name: "revenexx/.github"
      - dependency-name: "revenexx/.github/*"
      - dependency-name: "revenexx/.github/**"
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions:
        applies-to: version-updates
        patterns: ["*"]
